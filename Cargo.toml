[package]
name = "session-sounds"
version = "1.0.0"
edition = "2021"
license = "MIT"

[dependencies]
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "session-sounds"
path = "src/main.rs"
