name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Validate stable release identity
        id: identity
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Only stable semantic tags are releasable: $RELEASE_TAG" >&2
            exit 1
          fi
          VERSION=${RELEASE_TAG#v}
          CARGO_VERSION=$(awk '
            /^\[package\]$/ { package = 1; next }
            /^\[/ && package { exit }
            package && /^version[[:space:]]*=/ {
              value = $0
              sub(/^[^=]*=[[:space:]]*"/, "", value)
              sub(/"[[:space:]]*$/, "", value)
              print value
              exit
            }
          ' Cargo.toml)
          MANIFEST_VERSION=$(awk -F '"' '/^version[[:space:]]*=/ { print $2; exit }' herdr-plugin.toml)
          test "$VERSION" = "$CARGO_VERSION"
          test "$VERSION" = "$MANIFEST_VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            binary: session-sounds
            tool: cargo
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: session-sounds
            tool: cargo
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary: session-sounds
            tool: cross
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: session-sounds
            tool: cargo
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: session-sounds.exe
            tool: cargo
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable snapshot
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install cross
        if: matrix.tool == 'cross'
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2
        with:
          tool: cross
      - name: Build with Cargo
        if: matrix.tool == 'cargo'
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Build Linux ARM64 with cross
        if: matrix.tool == 'cross'
        run: cross build --release --locked --target ${{ matrix.target }}
      - name: Stage Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/${{ matrix.target }}"
          install -m 0755 "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.target }}/${{ matrix.binary }}"
      - name: Stage Windows binary
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $Directory = "dist/${{ matrix.target }}"
          New-Item -ItemType Directory -Path $Directory -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$Directory/${{ matrix.binary }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: dist/${{ matrix.target }}/${{ matrix.binary }}
          if-no-files-found: error

  publish:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          path: inputs
      - name: Package final archives and checksums
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          REPOSITORY='ChrisPachulski/session-sounds'
          test "$REPOSITORY" = "$GITHUB_REPOSITORY"
          scripts/package-release.sh "$VERSION" inputs release
      - name: Publish one GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: |
            release/session-sounds-v*.tar.gz
            release/session-sounds-v*.zip
            release/SHA256SUMS
